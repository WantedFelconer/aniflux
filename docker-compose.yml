version: '3.8'

services:
  aniflux-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aniflux-streaming-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5000
      - GUMLET_API_KEY=${GUMLET_API_KEY:-}
      - GUMLET_SOURCE_ID=${GUMLET_SOURCE_ID:-}
      - SUPERVISOR_INTERVAL_MINUTES=30
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-aniflux}
      - DB_SSL=${DB_SSL:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
